[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_piper_x"
version = "0.1.0"
description = "AgileX Piper-X follower and passive leader integration for LeRobot"
requires-python = ">=3.12"
dependencies = ["lerobot>=0.6.2,<0.7", "piper-sdk==0.6.2", "python-can>=4.4,<5", "numpy>=1.24,<3"]

[project.scripts]
piper-inspect = "lerobot_robot_piper_x.inspect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lerobot_robot_piper_x = ["models/*.urdf", "models/LICENSE", "models/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
