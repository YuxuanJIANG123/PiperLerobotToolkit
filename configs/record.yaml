# Two Piper-X arms: passive feedback leader and bounded follower.
# Follower limits/cameras inherited from the existing installation; verify if replaced.
robot:
  type: piper_x
  id: piper_x_follower
  can_name: piper_follower
  enable_motors: false
  high_follow: false
  motion_speed: 50
  # Maximum target offset from measured joints, not a velocity guarantee.
  max_joint_step_rad: 0.03
  max_gripper_step_m: 0.003
  debug_motion: true
  joint_limits_rad:
  - - -2.6179938779914944
    - 2.6179938779914944
  - - 0.0
    - 3.141592653589793
  - - -2.9670597283903604
    - 0.0
  - - -1.5533430342749532
    - 1.5533430342749532
  - - -1.5533430342749532
    - 1.5533430342749532
  - - -2.9670597283903604
    - 2.9670597283903604
  cameras:
    wrist:
      type: intelrealsense
      serial_number_or_name: '346122071508'
      width: 640
      height: 480
      fps: 30
    third_person:
      type: intelrealsense
      serial_number_or_name: '405622074798'
      width: 640
      height: 480
      fps: 30
teleop:
  type: piper_x_leader
  id: piper_x_leader
  can_name: piper_leader
  source: feedback
  feedback_timeout_s: 0.5
  connect_timeout_s: 30
  control_mode: joint
dataset:
  repo_id: local/piper_x_pair_pick
  no_stamp: false
  root: data/piper_x_pair_pick
  single_task: Pick up the object and place it in the container
  fps: 30
  num_episodes: 10
  episode_time_s: 30
  reset_time_s: 10
  push_to_hub: false
display_data: false
play_sounds: false
